services:
  - type: web
    name: soham-chatbot
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soham-chatbot-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: CRM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

databases:
  - name: soham-chatbot-db
    plan: free
